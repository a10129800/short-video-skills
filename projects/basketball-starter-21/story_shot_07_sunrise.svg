<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Background Gradient (Atmospheric Deep Gym Shadows to Golden Dawn) -->
    <linearGradient id="skyDawn" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0a0812"/>
      <stop offset="25%" stop-color="#140f1a"/>
      <stop offset="60%" stop-color="#2a1608"/>
      <stop offset="85%" stop-color="#180e06"/>
      <stop offset="100%" stop-color="#0d0703"/>
    </linearGradient>

    <!-- Hardwood Court Gradient -->
    <linearGradient id="floorGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2c170a"/>
      <stop offset="30%" stop-color="#4a250f"/>
      <stop offset="70%" stop-color="#2e1406"/>
      <stop offset="100%" stop-color="#150902"/>
    </linearGradient>

    <!-- God Rays Gradient 1 -->
    <linearGradient id="godRay1" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#fde047" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>

    <!-- God Rays Gradient 2 -->
    <linearGradient id="godRay2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </linearGradient>

    <!-- Skylight Glow -->
    <radialGradient id="sunSource" cx="75%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#ea580c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Reflection Highlight -->
    <radialGradient id="floorReflection" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Jersey Number 21 Gradient -->
    <linearGradient id="jerseyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Character Rim Light Gold -->
    <linearGradient id="rimLightRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="85%" stop-color="#1e293b"/>
      <stop offset="96%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Filter for Lens Flare & Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="megaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Background Arena Space -->
  <rect width="1080" height="1920" fill="url(#skyDawn)"/>

  <!-- Arena Upper Steel Trusses & Girders -->
  <g stroke="#261a10" stroke-width="6" opacity="0.65">
    <line x1="0" y1="200" x2="1080" y2="200"/>
    <line x1="0" y1="360" x2="1080" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="840" y1="0" x2="840" y2="400"/>
    <!-- Diagonal Trusses -->
    <line x1="0" y1="200" x2="120" y2="360"/>
    <line x1="120" y1="200" x2="0" y2="360"/>
    <line x1="120" y1="200" x2="360" y2="360"/>
    <line x1="360" y1="200" x2="120" y2="360"/>
    <line x1="360" y1="200" x2="600" y2="360"/>
    <line x1="600" y1="200" x2="360" y2="360"/>
    <line x1="600" y1="200" x2="840" y2="360"/>
    <line x1="840" y1="200" x2="600" y2="360"/>
    <line x1="840" y1="200" x2="1080" y2="360"/>
    <line x1="1080" y1="200" x2="840" y2="360"/>
  </g>

  <!-- Distant Arena Seating & Shadows -->
  <path d="M 0 780 L 1080 780 L 1080 1100 L 0 1100 Z" fill="#110a05" opacity="0.8"/>
  <line x1="0" y1="840" x2="1080" y2="840" stroke="#1d1109" stroke-width="3"/>
  <line x1="0" y1="920" x2="1080" y2="920" stroke="#1d1109" stroke-width="3"/>
  <line x1="0" y1="1000" x2="1080" y2="1000" stroke="#1d1109" stroke-width="3"/>

  <!-- High Cathedral Window Arches (Top Right) -->
  <g stroke="#451a03" stroke-width="8" fill="none">
    <path d="M 680 80 Q 820 20 960 80 L 960 400 L 680 400 Z" fill="#3a1c0b" opacity="0.7"/>
    <path d="M 460 120 Q 560 70 660 120 L 660 400 L 460 400 Z" fill="#3a1c0b" opacity="0.6"/>
  </g>

  <!-- 2. Hardwood Basketball Court Floor (Perspective Floor) -->
  <path d="M 0 1080 L 1080 1080 L 1080 1920 L 0 1920 Z" fill="url(#floorGrad)"/>

  <!-- Wood Planks Perspective Lines -->
  <g stroke="#1a0b04" stroke-width="3" opacity="0.5">
    <line x1="540" y1="1080" x2="540" y2="1920"/>
    <line x1="480" y1="1080" x2="420" y2="1920"/>
    <line x1="600" y1="1080" x2="660" y2="1920"/>
    <line x1="420" y1="1080" x2="280" y2="1920"/>
    <line x1="660" y1="1080" x2="800" y2="1920"/>
    <line x1="360" y1="1080" x2="140" y2="1920"/>
    <line x1="720" y1="1080" x2="940" y2="1920"/>
    <line x1="300" y1="1080" x2="-20" y2="1920"/>
    <line x1="780" y1="1080" x2="1100" y2="1920"/>
  </g>

  <!-- Polished Court Planks Highlights -->
  <line x1="120" y1="1260" x2="960" y2="1260" stroke="#ffb703" stroke-width="1.5" opacity="0.12"/>
  <line x1="80" y1="1450" x2="1000" y2="1450" stroke="#ffb703" stroke-width="1.5" opacity="0.15"/>
  <line x1="40" y1="1680" x2="1040" y2="1680" stroke="#ffb703" stroke-width="2" opacity="0.18"/>

  <!-- Center Court Jump-Ball Circle (Perspective Ellipse) -->
  <ellipse cx="540" cy="1540" rx="360" ry="110" fill="none" stroke="#ffb703" stroke-width="7" opacity="0.85" filter="url(#softGlow)"/>
  <ellipse cx="540" cy="1540" rx="140" ry="44" fill="none" stroke="#e63946" stroke-width="5" opacity="0.9"/>
  <!-- Half-Court Line -->
  <line x1="0" y1="1540" x2="1080" y2="1540" stroke="#ffb703" stroke-width="6" opacity="0.85"/>

  <!-- Huge Floor Reflection Glow of God Rays -->
  <ellipse cx="580" cy="1520" rx="420" ry="240" fill="url(#floorReflection)"/>

  <!-- 3. Giant Volumetric God Rays (Light Beams Streaming from Cathedral Window) -->
  <polygon points="780,40 1020,40 850,1920 280,1920" fill="url(#godRay1)"/>
  <polygon points="620,80 840,80 560,1920 40,1920" fill="url(#godRay2)"/>
  <polygon points="860,20 1080,20 1080,1800 680,1920" fill="url(#godRay1)" opacity="0.7"/>

  <!-- Brilliant Sun Source Glow (Top Right Window) -->
  <ellipse cx="860" cy="140" rx="340" ry="200" fill="url(#sunSource)" filter="url(#megaGlow)"/>

  <!-- 4. Hero Character: Lu Zi-xuan #21 (Back View, Moving into Center Court) -->
  
  <!-- Cast Shadow on Polished Wood Floor -->
  <ellipse cx="540" cy="1780" rx="140" ry="32" fill="#000000" opacity="0.75"/>
  <ellipse cx="590" cy="1760" rx="90" ry="22" fill="#2d1303" opacity="0.5"/>

  <!-- Hero Body Group -->
  <g id="luZixuanHeroBack">
    <!-- Legs & Black Compression Tights -->
    <!-- Left Leg (Stepping Forward) -->
    <path d="M 470 1480 L 455 1620 L 440 1740 L 485 1750 L 515 1620 L 510 1480 Z" fill="#090d14"/>
    <!-- Right Leg (Anchor Foot) -->
    <path d="M 570 1480 L 575 1620 L 585 1740 L 635 1735 L 615 1620 L 610 1480 Z" fill="#090d14"/>
    
    <!-- Red-Black-White High-Top Sneakers (AJ1 Bred silhouette) -->
    <!-- Left Sneaker -->
    <path d="M 435 1735 L 420 1765 L 450 1780 L 495 1775 L 490 1740 Z" fill="#d00000"/>
    <path d="M 420 1765 L 415 1780 L 485 1785 L 495 1775 Z" fill="#ffffff"/>
    <line x1="435" y1="1750" x2="480" y2="1755" stroke="#000000" stroke-width="4"/>

    <!-- Right Sneaker (Front foot crossing half-court line) -->
    <path d="M 580 1730 L 575 1760 L 615 1775 L 650 1765 L 640 1730 Z" fill="#d00000"/>
    <path d="M 575 1760 L 570 1775 L 640 1780 L 650 1765 Z" fill="#ffffff"/>
    <line x1="590" y1="1745" x2="635" y2="1745" stroke="#000000" stroke-width="4"/>

    <!-- Basketball Shorts (Black with Red/Gold Trim) -->
    <path d="M 430 1280 L 390 1490 L 500 1510 L 540 1340 L 580 1510 L 690 1490 L 650 1280 Z" fill="#0a0e17" stroke="#1c2538" stroke-width="2"/>
    <!-- Red & Gold Hem Trims -->
    <path d="M 390 1490 L 500 1510" stroke="#ffb703" stroke-width="7"/>
    <path d="M 392 1482 L 498 1502" stroke="#e63946" stroke-width="4"/>
    <path d="M 580 1510 L 690 1490" stroke="#ffb703" stroke-width="7"/>
    <path d="M 582 1502 L 688 1482" stroke="#e63946" stroke-width="4"/>

    <!-- Muscular Torso & Jersey Back -->
    <path d="M 440 920 L 390 1020 L 420 1290 L 660 1290 L 690 1020 L 640 920 Z" fill="#080c14"/>
    <!-- Rim Light on Right Shoulder/Back (Hit by Sunbeam) -->
    <path d="M 540 920 L 640 920 L 690 1020 L 660 1290 L 630 1290 L 650 1020 L 610 930 Z" fill="#fbbf24" opacity="0.35"/>

    <!-- Jersey Armhole & Neck Red-Gold Trim -->
    <path d="M 440 920 L 485 935 L 595 935 L 640 920" stroke="#ffb703" stroke-width="6" fill="none"/>
    <path d="M 442 927 L 485 941 L 595 941 L 638 927" stroke="#e63946" stroke-width="4" fill="none"/>
    <path d="M 440 920 Q 400 1000 420 1070" stroke="#ffb703" stroke-width="6" fill="none"/>
    <path d="M 640 920 Q 680 1000 660 1070" stroke="#ffb703" stroke-width="6" fill="none"/>

    <!-- Player Name on Jersey: LU ZI-XUAN -->
    <text x="540" y="995" fill="#f8fafc" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="8">LU ZI-XUAN</text>

    <!-- BOLD RADIANT GOLD NUMBER 21 -->
    <g filter="url(#softGlow)">
      <text x="540" y="1190" fill="url(#jerseyGold)" stroke="#d97706" stroke-width="3" font-family="'Impact', Arial Black, sans-serif" font-size="190" font-weight="900" text-anchor="middle" letter-spacing="10">21</text>
    </g>

    <!-- Red Stroke Accent inside Number -->
    <text x="540" y="1190" fill="none" stroke="#e63946" stroke-width="2" font-family="'Impact', Arial Black, sans-serif" font-size="190" font-weight="900" text-anchor="middle" letter-spacing="10" opacity="0.8">21</text>

    <!-- Athletic Lean Arms with Veins & Sweat Glisten -->
    <!-- Left Arm: Reaching up bending elbow to adjust wristband -->
    <path d="M 440 920 L 330 1000 L 360 1150 L 400 1145 L 375 1030 L 465 960 Z" fill="#b45309" opacity="0.9"/>
    <path d="M 360 1150 L 445 1190 L 460 1150 L 390 1120 Z" fill="#92400e"/>
    <!-- Black Wristband on Left Wrist -->
    <rect x="420" y="1140" width="48" height="32" rx="6" transform="rotate(25 435 1155)" fill="#000000" stroke="#ffb703" stroke-width="2.5"/>

    <!-- Right Arm: Muscular arm hanging naturally, fist clenching -->
    <path d="M 640 920 L 740 1020 L 720 1200 L 680 1200 L 695 1040 L 615 950 Z" fill="#d97706" opacity="0.95"/>
    <ellipse cx="700" cy="1235" rx="25" ry="35" fill="#b45309"/>
    <!-- Bright Golden Rim Light along Right Arm & Hand -->
    <path d="M 640 920 L 740 1020 L 720 1200" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#softGlow)"/>

    <!-- Neck & Head (Back of head, messy layered black spiky anime hair) -->
    <path d="M 495 860 L 490 930 L 590 930 L 585 860 Z" fill="#9a3412"/>
    <!-- Head & Hair Silhouette -->
    <ellipse cx="540" cy="800" rx="90" ry="105" fill="#080c14"/>
    <!-- Layered Spiky Hair Strands -->
    <polygon points="500,740 450,710 520,770" fill="#0a0f1d"/>
    <polygon points="530,710 520,660 560,730" fill="#0a0f1d"/>
    <polygon points="560,700 580,650 595,730" fill="#0a0f1d"/>
    <polygon points="600,720 640,690 610,770" fill="#0a0f1d"/>
    <polygon points="620,760 670,750 625,810" fill="#0a0f1d"/>
    <polygon points="460,760 410,770 470,820" fill="#0a0f1d"/>
    <polygon points="480,820 430,850 495,870" fill="#0a0f1d"/>
    <polygon points="600,820 650,850 585,870" fill="#0a0f1d"/>
    
    <!-- Golden Rim Light outlining Right Edge of Hair & Neck -->
    <path d="M 540 680 Q 630 700 640 820 L 590 920" stroke="#fef08a" stroke-width="7" fill="none" filter="url(#softGlow)"/>
    <path d="M 540 680 Q 630 700 640 820 L 590 920" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  </g>

  <!-- 5. Floating Dust Motes & Golden Bokeh in Sunbeam (Atmospheric Embers) -->
  <g fill="#fef08a" filter="url(#softGlow)">
    <circle cx="820" cy="340" r="10" opacity="0.9"/>
    <circle cx="760" cy="520" r="7" opacity="0.8"/>
    <circle cx="890" cy="680" r="12" opacity="0.75"/>
    <circle cx="680" cy="620" r="6" opacity="0.85"/>
    <circle cx="740" cy="850" r="9" opacity="0.8"/>
    <circle cx="620" cy="980" r="8" opacity="0.7"/>
    <circle cx="810" cy="1120" r="14" opacity="0.85"/>
    <circle cx="680" cy="1280" r="10" opacity="0.75"/>
    <circle cx="560" cy="1380" r="7" opacity="0.9"/>
    <circle cx="480" cy="1200" r="5" opacity="0.6"/>
    <circle cx="380" cy="1420" r="8" opacity="0.55"/>
    <circle cx="720" cy="1600" r="11" opacity="0.7"/>
    <circle cx="850" cy="1480" r="9" opacity="0.65"/>
    <circle cx="940" cy="1220" r="13" opacity="0.6"/>
    <circle cx="640" cy="1720" r="7" opacity="0.8"/>
  </g>

  <!-- Micro Sparkling Dust Particles -->
  <g fill="#ffffff">
    <circle cx="790" cy="400" r="3.5"/>
    <circle cx="840" cy="620" r="4"/>
    <circle cx="710" cy="780" r="3"/>
    <circle cx="760" cy="920" r="3.5"/>
    <circle cx="650" cy="1050" r="2.5"/>
    <circle cx="580" cy="1180" r="3"/>
    <circle cx="620" cy="1420" r="3.5"/>
    <circle cx="780" cy="1350" r="4"/>
  </g>

  <!-- 6. Heroic Vignette & Cinema Letterbox Tone -->
  <rect width="1080" height="1920" fill="none" stroke="#000000" stroke-width="20" opacity="0.8"/>
  <rect x="0" y="0" width="1080" height="160" fill="linear-gradient(to bottom, rgba(0,0,0,0.7), transparent)"/>
  <rect x="0" y="1760" width="1080" height="160" fill="linear-gradient(to top, rgba(0,0,0,0.8), transparent)"/>
</svg>
