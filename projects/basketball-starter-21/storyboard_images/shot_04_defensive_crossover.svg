<svg xmlns="http://www.w3.org/2000/svg" width="576" height="1024" viewBox="0 0 576 1024">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111c30"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="violetBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="speedBlur" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="576" height="1024" fill="url(#bgGrad4)"/>
  <rect x="16" y="16" width="544" height="992" rx="12" fill="none" stroke="#25334d" stroke-width="2"/>
  
  <line x1="192" y1="16" x2="192" y2="1008" stroke="#151e30" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="384" y1="16" x2="384" y2="1008" stroke="#151e30" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="16" y1="341" x2="560" y2="341" stroke="#151e30" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="16" y1="682" x2="560" y2="682" stroke="#151e30" stroke-width="1" stroke-dasharray="6 6"/>

  <rect x="32" y="32" width="160" height="42" rx="8" fill="url(#violetBadge)"/>
  <text x="112" y="59" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="1">SHOT 04</text>
  
  <rect x="202" y="32" width="130" height="42" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="267" y="58" fill="#c7d2fe" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">00:22 - 00:36</text>

  <rect x="342" y="32" width="202" height="42" rx="8" fill="#31104b" stroke="#a855f7" stroke-width="1"/>
  <circle cx="358" cy="53" r="5" fill="#a855f7"/>
  <text x="444" y="58" fill="#c084fc" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">覺醒 · 瘋狗防守</text>

  <text x="32" y="105" fill="#f1f5f9" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">DYNAMIC ACTION WHIP PAN &amp; CUT</text>
  <text x="32" y="128" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Angle: Low-Angle Action Tilt | Movement: Rapid Lateral Pan following ball strip</text>

  <!-- Illustration -->
  <rect x="32" y="146" width="512" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Speed Lines & Motion Streaks -->
  <line x1="80" y1="280" x2="300" y2="280" stroke="url(#speedBlur)" stroke-width="8" stroke-linecap="round"/>
  <line x1="120" y1="320" x2="350" y2="320" stroke="url(#speedBlur)" stroke-width="12" stroke-linecap="round"/>
  <line x1="150" y1="360" x2="420" y2="360" stroke="url(#speedBlur)" stroke-width="6" stroke-linecap="round"/>

  <!-- Ball Handler Silhouette (Blurred/Defeated) in light opacity -->
  <path d="M 120 280 L 160 210 L 190 290 L 140 370" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round" opacity="0.5"/>
  <circle cx="160" cy="180" r="20" fill="#334155" opacity="0.5"/>

  <!-- Lu Zi-xuan #21 in Aggressive Defensive Steal -->
  <path d="M 280 290 L 320 220 L 360 280 M 320 220 L 440 250" fill="none" stroke="#090d16" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 320 220 L 440 250" fill="none" stroke="#ffb703" stroke-width="2" stroke-linecap="round"/>
  <!-- Jersey #21 -->
  <text x="320" y="275" fill="#ffb703" font-family="'Impact', Arial Black, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">21</text>
  <!-- Extended Arm with sharp fingers stripping ball -->
  <path d="M 320 240 L 230 260 L 180 270" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <!-- Stripped Basketball popping up with impact ring -->
  <circle cx="170" cy="270" r="24" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
  <circle cx="170" cy="270" r="32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Flying sweat droplets -->
  <circle cx="340" cy="200" r="3" fill="#38bdf8"/>
  <circle cx="360" cy="190" r="2" fill="#38bdf8"/>
  <circle cx="380" cy="210" r="2.5" fill="#38bdf8"/>

  <!-- Caption Overlay -->
  <rect x="44" y="440" width="488" height="36" rx="6" fill="#090d16" opacity="0.9"/>
  <text x="288" y="463" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" text-anchor="middle">
    「投籃會失手，但把對手咬死的防守，永遠不會背叛！」
  </text>

  <!-- Technical Specs -->
  <g transform="translate(32, 502)">
    <rect x="0" y="0" width="512" height="70" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="16" y="24" fill="#a855f7" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">CHARACTER &amp; LIGHTING ANCHOR</text>
    <text x="16" y="46" fill="#9ca3af" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
      陸子軒 #21 (Low Defensive Center of Gravity, Fierce Eyes) | Dynamic Strobe Rim Lights, Motion Streaks
    </text>

    <rect x="0" y="82" width="512" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="16" y="106" fill="#4ade80" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">AI VIDEO PROMPT (VEO 2 / KLING / RUNWAY)</text>
    <foreignObject x="16" y="116" width="480" height="186">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #cbd5e1; font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; line-height: 1.55; word-break: break-word;">
        <span style="color: #60a5fa;">[Style]:</span> Cinematic sports anime realism, 35mm film photography, 8k.<br/>
        <span style="color: #facc15;">[Subject]:</span> 20yo athletic East Asian basketball player Lu Zi-xuan #21, intense lock-up defense during scrimmage.<br/>
        <span style="color: #f87171;">[Action]:</span> Staying in low stance anticipating ball handler crossover, lunging forward with explosive arm deflection, fingertips stripping the basketball cleanly.<br/>
        <span style="color: #a78bfa;">[Lighting &amp; Dynamics]:</span> Speed motion blur, floor light reflections, sweat flying.<br/>
        <span style="color: #94a3b8;">[Specs]:</span> Dynamic Action Whip Pan, Low-angle Action Tilt, --ar 9:16
      </div>
    </foreignObject>

    <rect x="0" y="322" width="512" height="52" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="342" fill="#f87171" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold">NEGATIVE PROMPT:</text>
    <text x="16" y="360" fill="#71717a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">lazy defense, standing straight, blurry ball, disjointed limbs, extra fingers, cartoon</text>

    <rect x="0" y="384" width="512" height="70" rx="8" fill="#3b0764" stroke="#9333ea" stroke-width="1"/>
    <text x="16" y="406" fill="#d8b4fe" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold">AUDIO TRACK (TTS &amp; FOLEY SFX)</text>
    <text x="16" y="426" fill="#f3e8ff" font-family="'Segoe UI', Arial, sans-serif" font-size="12">VO: [firm/determined]「投籃會失手，但把對手咬死的防守，永遠不會背叛！」</text>
    <text x="16" y="444" fill="#e9d5ff" font-family="'Segoe UI', Arial, sans-serif" font-size="11">SFX: 胸膛對抗肉搏悶響 + 清脆切球啪聲 + 激昂弦樂戰鼓起奏（Epic Rise）</text>
  </g>

  <text x="32" y="995" fill="#475569" font-family="'Segoe UI', Arial, sans-serif" font-size="11">PROJECT: BASKETBALL-STARTER-21 · STORYBOARD IMAGE GENERATOR · 9:16 VERTICAL</text>
  <text x="544" y="995" fill="#475569" font-family="'Segoe UI', Arial, sans-serif" font-size="11" text-anchor="end">SLATE 04/07</text>
</svg>
