<svg xmlns="http://www.w3.org/2000/svg" width="576" height="1024" viewBox="0 0 576 1024">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>
    <linearGradient id="cyanBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="576" height="1024" fill="url(#bgGrad2)"/>
  <rect x="16" y="16" width="544" height="992" rx="12" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <line x1="192" y1="16" x2="192" y2="1008" stroke="#131b2e" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="384" y1="16" x2="384" y2="1008" stroke="#131b2e" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="16" y1="341" x2="560" y2="341" stroke="#131b2e" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="16" y1="682" x2="560" y2="682" stroke="#131b2e" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Header -->
  <rect x="32" y="32" width="160" height="42" rx="8" fill="url(#cyanBadge)"/>
  <text x="112" y="59" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="1">SHOT 02</text>
  
  <rect x="202" y="32" width="130" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="267" y="58" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">00:05 - 00:12</text>

  <rect x="342" y="32" width="202" height="42" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="358" cy="53" r="5" fill="#38bdf8"/>
  <text x="444" y="58" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">淬煉 · 晨霧滑步</text>

  <text x="32" y="105" fill="#e2e8f0" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">LOW-ANGLE LATERAL TRACKING SHOT</text>
  <text x="32" y="128" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Angle: Floor Level Dutch Angle | Movement: Fast Tracking along Floor Squeak</text>

  <!-- Illustration Container -->
  <rect x="32" y="146" width="512" height="340" rx="12" fill="url(#floorGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Perspective Court Hardwood Lines -->
  <line x1="0" y1="420" x2="576" y2="420" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="486" x2="220" y2="340" stroke="#1e293b" stroke-width="2"/>
  <line x1="280" y1="486" x2="360" y2="340" stroke="#1e293b" stroke-width="2"/>
  <line x1="480" y1="486" x2="490" y2="340" stroke="#1e293b" stroke-width="2"/>

  <!-- Morning Mist / Fog Gradients -->
  <rect x="32" y="146" width="512" height="120" fill="url(#steamGrad)" opacity="0.3"/>
  <ellipse cx="280" cy="180" rx="200" ry="40" fill="#38bdf8" opacity="0.08"/>

  <!-- Lone Gym Spotlight Cone -->
  <polygon points="288,146 160,420 416,420" fill="#38bdf8" opacity="0.07"/>

  <!-- Low Defensive Sliding Figure -->
  <!-- Legs spread wide in low stance -->
  <path d="M 288 290 L 230 350 L 170 420 M 288 290 L 350 360 L 410 425" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 288 290 L 230 350 L 170 420 M 288 290 L 350 360 L 410 425" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Torso & Arms low -->
  <path d="M 288 230 L 288 295" fill="none" stroke="#0f172a" stroke-width="32" stroke-linecap="round"/>
  <text x="288" y="280" fill="#ffb703" font-family="'Impact', Arial Black, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">21</text>
  <!-- Arms spread wide -->
  <path d="M 200 270 L 288 260 L 380 280" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <!-- Head with sweat steam -->
  <circle cx="288" cy="205" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <!-- White steam breath -->
  <ellipse cx="320" cy="200" rx="25" ry="12" fill="url(#steamGrad)" opacity="0.8"/>
  
  <!-- Floor Friction Sparks & Sweat Drops -->
  <ellipse cx="170" cy="425" rx="24" ry="4" fill="#38bdf8" opacity="0.5"/>
  <ellipse cx="410" cy="430" rx="24" ry="4" fill="#38bdf8" opacity="0.5"/>
  <circle cx="288" cy="400" r="3" fill="#0284c7" opacity="0.8"/>
  <circle cx="270" cy="380" r="2" fill="#0284c7" opacity="0.7"/>

  <!-- Caption Overlay -->
  <rect x="44" y="440" width="488" height="36" rx="6" fill="#090d14" opacity="0.9"/>
  <text x="288" y="463" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="13" text-anchor="middle">
    「但我不是來這裡……當一輩子觀眾的！」
  </text>

  <!-- Technical Specs -->
  <g transform="translate(32, 502)">
    <rect x="0" y="0" width="512" height="70" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="16" y="24" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">CHARACTER &amp; LIGHTING ANCHOR</text>
    <text x="16" y="46" fill="#9ca3af" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
      陸子軒 #21 (Sweat Drenched, Black Leg Tights) | 05:30 AM Cold Cyan Mist, Floor Specular Reflections
    </text>

    <rect x="0" y="82" width="512" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="16" y="106" fill="#4ade80" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">AI VIDEO PROMPT (VEO 2 / KLING / RUNWAY)</text>
    <foreignObject x="16" y="116" width="480" height="186">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #cbd5e1; font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; line-height: 1.55; word-break: break-word;">
        <span style="color: #60a5fa;">[Style]:</span> Cinematic sports film aesthetic, 35mm film photography, 8k.<br/>
        <span style="color: #facc15;">[Subject]:</span> 20yo athletic East Asian male basketball player Lu Zi-xuan #21 in black jersey and compression knee tights, intense defensive sliding steps low to reflective hardwood floor.<br/>
        <span style="color: #f87171;">[Action &amp; Dynamics]:</span> Squeaking rubber sneakers gripping polished floor, heavy sweat dripping from chin creating dark spots on wood, exhaling visible steam in cold air.<br/>
        <span style="color: #a78bfa;">[Lighting &amp; Environment]:</span> 5:30 AM empty gymnasium, cold blue morning mist, single ceiling beam.<br/>
        <span style="color: #94a3b8;">[Specs]:</span> Low-Angle Lateral Tracking Shot, Floor Level Dutch Angle, --ar 9:16
      </div>
    </foreignObject>

    <rect x="0" y="322" width="512" height="52" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="342" fill="#f87171" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold">NEGATIVE PROMPT:</text>
    <text x="16" y="360" fill="#71717a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">crowd, daytime, bright sunny, clean dry skin, static pose, deformed shoes, cartoon</text>

    <rect x="0" y="384" width="512" height="70" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="16" y="406" fill="#38bdf8" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold">AUDIO TRACK (TTS &amp; FOLEY SFX)</text>
    <text x="16" y="426" fill="#bae6fd" font-family="'Segoe UI', Arial, sans-serif" font-size="12">VO: [gasp/panting]「但我不是來這裡……當一輩子觀眾的！」</text>
    <text x="16" y="444" fill="#7dd3fc" font-family="'Segoe UI', Arial, sans-serif" font-size="11">SFX: 球鞋急速煞車摩擦尖叫聲（Sneaker Squeak）+ 沉重喘息回音</text>
  </g>

  <text x="32" y="995" fill="#475569" font-family="'Segoe UI', Arial, sans-serif" font-size="11">PROJECT: BASKETBALL-STARTER-21 · STORYBOARD IMAGE GENERATOR · 9:16 VERTICAL</text>
  <text x="544" y="995" fill="#475569" font-family="'Segoe UI', Arial, sans-serif" font-size="11" text-anchor="end">SLATE 02/07</text>
</svg>
