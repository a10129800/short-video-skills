<svg xmlns="http://www.w3.org/2000/svg" width="576" height="1024" viewBox="0 0 576 1024">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180509"/>
      <stop offset="50%" stop-color="#2a0812"/>
      <stop offset="100%" stop-color="#0e0407"/>
    </linearGradient>
    <linearGradient id="redBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="crashFlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="576" height="1024" fill="url(#bgGrad5)"/>
  <rect x="16" y="16" width="544" height="992" rx="12" fill="none" stroke="#4c0519" stroke-width="2"/>
  
  <line x1="192" y1="16" x2="192" y2="1008" stroke="#2b0811" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="384" y1="16" x2="384" y2="1008" stroke="#2b0811" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="16" y1="341" x2="560" y2="341" stroke="#2b0811" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="16" y1="682" x2="560" y2="682" stroke="#2b0811" stroke-width="1" stroke-dasharray="6 6"/>

  <rect x="32" y="32" width="160" height="42" rx="8" fill="url(#redBadge)"/>
  <text x="112" y="59" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="1">SHOT 05</text>
  
  <rect x="202" y="32" width="130" height="42" rx="8" fill="#2e0811" stroke="#881337" stroke-width="1"/>
  <text x="267" y="58" fill="#fda4af" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">00:36 - 00:48</text>

  <rect x="342" y="32" width="202" height="42" rx="8" fill="#881337" stroke="#f43f5e" stroke-width="1"/>
  <circle cx="358" cy="53" r="5" fill="#f43f5e"/>
  <text x="444" y="58" fill="#fff" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CLIMAX · 平飛救球</text>

  <text x="32" y="105" fill="#ffe4e6" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">120FPS SLOW-MOTION CRASH ZOOM</text>
  <text x="32" y="128" fill="#fb7185" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Angle: Low Floor-Level Dynamic Angle | Movement: Fast Crash Zoom into Impact</text>

  <!-- Illustration -->
  <rect x="32" y="146" width="512" height="340" rx="12" fill="#1c050b" stroke="#881337" stroke-width="1.5"/>
  
  <!-- Boundary Line -->
  <line x1="160" y1="486" x2="300" y2="146" stroke="#fff" stroke-width="4" stroke-dasharray="16 16" opacity="0.6"/>
  <text x="130" y="320" fill="#f43f5e" font-family="'Impact', sans-serif" font-size="18" opacity="0.5" transform="rotate(-68 130 320)">COURT BOUNDARY</text>

  <!-- Crashing Technical Table / Folding Chairs (Right Side) -->
  <polygon points="400,340 480,280 520,380 430,420" fill="#27272a" stroke="#71717a" stroke-width="2"/>
  <line x1="420" y1="360" x2="490" y2="440" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round"/>
  <line x1="480" y1="310" x2="530" y2="390" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round"/>
  <!-- Flying Papers and Water Bottles -->
  <rect x="380" y="270" width="20" height="28" rx="2" fill="#fff" opacity="0.8" transform="rotate(25 380 270)"/>
  <rect x="460" y="240" width="22" height="30" rx="2" fill="#fff" opacity="0.7" transform="rotate(-40 460 240)"/>
  <circle cx="430" cy="220" r="10" fill="#38bdf8" opacity="0.5"/>

  <!-- Lu Zi-xuan Full Airborne Horizontal Dive (Center-Left to Center-Right) -->
  <!-- Horizontal Body parallel to ground -->
  <path d="M 120 310 L 250 290 L 370 280" fill="none" stroke="#0f172a" stroke-width="36" stroke-linecap="round"/>
  <path d="M 120 310 L 250 290 L 370 280" fill="none" stroke="#ffb703" stroke-width="3" stroke-linecap="round"/>
  <!-- Jersey Number 21 on horizontal back -->
  <text x="250" y="298" fill="#ffb703" font-family="'Impact', Arial Black, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">21</text>
  <!-- Extended Arm scooping the basketball -->
  <path d="M 370 280 L 410 260 L 435 240" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <circle cx="445" cy="235" r="22" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
  <!-- Curved motion trail on ball being scooped back -->
  <path d="M 445 235 Q 360 160 220 180" fill="none" stroke="#ffb703" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>

  <!-- Veins & Sweat Sprays -->
  <circle cx="380" cy="240" r="3" fill="#f43f5e"/>
  <circle cx="395" cy="230" r="2" fill="#f43f5e"/>
  <circle cx="270" cy="270" r="3" fill="#38bdf8"/>

  <!-- Caption Overlay -->
  <rect x="44" y="440" width="488" height="36" rx="6" fill="#0e0407" opacity="0.9"/>
  <text x="288" y="463" fill="#ffe4e6" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" text-anchor="middle">
    「橫身救球！不可思議！壓哨絕殺——！！」
  </text>

  <!-- Technical Specs -->
  <g transform="translate(32, 502)">
    <rect x="0" y="0" width="512" height="70" rx="8" fill="#2e0811" stroke="#881337" stroke-width="1"/>
    <text x="16" y="24" fill="#fda4af" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">CHARACTER &amp; LIGHTING ANCHOR</text>
    <text x="16" y="46" fill="#f43f5e" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
      陸子軒 #21 (Airborne Parallel to Floor, Veins Bulging) | 120fps Flash Strobe, Flying Papers &amp; Water Bottles
    </text>

    <rect x="0" y="82" width="512" height="230" rx="8" fill="#1f060c" stroke="#881337" stroke-width="1"/>
    <text x="16" y="106" fill="#4ade80" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">AI VIDEO PROMPT (VEO 2 / KLING / RUNWAY)</text>
    <foreignObject x="16" y="116" width="480" height="186">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #fecdd3; font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; line-height: 1.55; word-break: break-word;">
        <span style="color: #60a5fa;">[Style]:</span> Cinematic sports action, 120fps slow-motion, 8k resolution.<br/>
        <span style="color: #facc15;">[Subject]:</span> 20yo athletic East Asian basketball player Lu Zi-xuan #21, airborne horizontal dive parallel to hardwood court outside boundary line.<br/>
        <span style="color: #f87171;">[Climax Action]:</span> Veins bulging on forearm, one hand scooping loose basketball back onto court, body violently crashing through courtside press table and metal folding chairs, flying water bottles and papers.<br/>
        <span style="color: #a78bfa;">[Lighting]:</span> High intensity arena floodlights, dramatic sweat droplets spraying.<br/>
        <span style="color: #94a3b8;">[Specs]:</span> 120fps Crash Zoom, Low Floor-Level Dynamic Angle, --ar 9:16
      </div>
    </foreignObject>

    <rect x="0" y="322" width="512" height="52" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="342" fill="#f87171" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold">NEGATIVE PROMPT:</text>
    <text x="16" y="360" fill="#71717a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">standing, calm expression, safe landing, missing limbs, bad physics, static frame, deformed hands</text>

    <rect x="0" y="384" width="512" height="70" rx="8" fill="#4c0519" stroke="#be123c" stroke-width="1"/>
    <text x="16" y="406" fill="#f43f5e" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold">AUDIO TRACK (TTS &amp; FOLEY SFX)</text>
    <text x="16" y="426" fill="#ffe4e6" font-family="'Segoe UI', Arial, sans-serif" font-size="12">VO: [shout/screaming]「橫身救球！不可思議！壓哨絕殺——！！」</text>
    <text x="16" y="444" fill="#fda4af" font-family="'Segoe UI', Arial, sans-serif" font-size="11">SFX: 撞翻金屬桌椅巨響（Heavy Metal Crash）+ 全場萬人雷鳴般狂暴歡呼</text>
  </g>

  <text x="32" y="995" fill="#475569" font-family="'Segoe UI', Arial, sans-serif" font-size="11">PROJECT: BASKETBALL-STARTER-21 · STORYBOARD IMAGE GENERATOR · 9:16 VERTICAL</text>
  <text x="544" y="995" fill="#475569" font-family="'Segoe UI', Arial, sans-serif" font-size="11" text-anchor="end">SLATE 05/07</text>
</svg>
