<svg xmlns="http://www.w3.org/2000/svg" width="576" height="1024" viewBox="0 0 576 1024">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="50%" stop-color="#13233a"/>
      <stop offset="100%" stop-color="#080e18"/>
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="sunBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="576" height="1024" fill="url(#bgGrad6)"/>
  <rect x="16" y="16" width="544" height="992" rx="12" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  
  <line x1="192" y1="16" x2="192" y2="1008" stroke="#0e2338" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="384" y1="16" x2="384" y2="1008" stroke="#0e2338" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="16" y1="341" x2="560" y2="341" stroke="#0e2338" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="16" y1="682" x2="560" y2="682" stroke="#0e2338" stroke-width="1" stroke-dasharray="6 6"/>

  <rect x="32" y="32" width="160" height="42" rx="8" fill="url(#goldBadge)"/>
  <text x="112" y="59" fill="#0f172a" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="1">SHOT 06</text>
  
  <rect x="202" y="32" width="130" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="267" y="58" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">00:48 - 00:54</text>

  <rect x="342" y="32" width="202" height="42" rx="8" fill="#422006" stroke="#eab308" stroke-width="1"/>
  <circle cx="358" cy="53" r="5" fill="#eab308"/>
  <text x="444" y="58" fill="#fef08a" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">加冕 · 先發五人</text>

  <text x="32" y="105" fill="#fef08a" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">MACRO RACK FOCUS TILT-UP</text>
  <text x="32" y="128" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Angle: Eye-Level Macro Whiteboard | Movement: Rack Focus to Reddened Eyes</text>

  <!-- Illustration -->
  <rect x="32" y="146" width="512" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Sunbeams cutting through locker room blinds -->
  <polygon points="32,146 160,146 480,486 352,486" fill="url(#sunBeam)"/>
  <polygon points="180,146 280,146 544,420 544,300" fill="url(#sunBeam)"/>

  <!-- Tactical Whiteboard Frame -->
  <rect x="60" y="180" width="260" height="240" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <rect x="68" y="188" width="244" height="26" fill="#0284c7" rx="3"/>
  <text x="190" y="206" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FINAL GAME STARTER 5</text>
  
  <!-- Whiteboard Written Text -->
  <text x="80" y="235" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-size="12">PG: #4 陳浩天</text>
  <text x="80" y="255" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-size="12">SG: #7 林敬</text>
  <text x="80" y="275" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-size="12">PF: #11 郭遠</text>
  <text x="80" y="295" fill="#334155" font-family="'Segoe UI', Arial, sans-serif" font-size="12">C: #15 趙磊</text>

  <!-- The Golden Highlight Written in Black Bold Marker -->
  <rect x="74" y="315" width="232" height="42" rx="4" fill="#fef08a" stroke="#eab308" stroke-width="2"/>
  <text x="82" y="342" fill="#09090b" font-family="'Impact', Arial Black, sans-serif" font-size="19" letter-spacing="1">SF: #21 陸子軒</text>

  <!-- Coach Hand Holding Marker -->
  <path d="M 280 400 L 260 360 L 250 350" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <rect x="240" y="342" width="12" height="20" rx="2" fill="#09090b"/>

  <!-- Lu Zi-xuan in Back Row (Rack Focus) -->
  <circle cx="430" cy="240" r="32" fill="#1e293b" stroke="#fef08a" stroke-width="2"/>
  <!-- Teary Reddened Eye reflection -->
  <circle cx="420" cy="235" r="4" fill="#38bdf8"/>
  <circle cx="440" cy="235" r="4" fill="#38bdf8"/>
  <line x1="422" y1="239" x2="422" y2="248" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Clenched Fists in foreground -->
  <rect x="390" y="360" width="34" height="28" rx="8" fill="#334155" stroke="#fef08a" stroke-width="1"/>
  <rect x="440" y="360" width="34" height="28" rx="8" fill="#334155" stroke="#fef08a" stroke-width="1"/>
  <!-- Teammate Pat on Shoulder -->
  <path d="M 480 260 L 460 250" fill="none" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>

  <!-- Caption Overlay -->
  <rect x="44" y="440" width="488" height="36" rx="6" fill="#080e18" opacity="0.9"/>
  <text x="288" y="463" fill="#fef08a" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" text-anchor="middle">
    「陸子軒，明天開場跳球，去把你的球場拿下來！」
  </text>

  <!-- Technical Specs -->
  <g transform="translate(32, 502)">
    <rect x="0" y="0" width="512" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" fill="#facc15" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">CHARACTER &amp; LIGHTING ANCHOR</text>
    <text x="16" y="46" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
      白板上的 #21 陸子軒 ➔ 陸子軒濕潤眼眶 | 3200K Volumetric Sunbeam Slits cutting through Blinds
    </text>

    <rect x="0" y="82" width="512" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="16" y="106" fill="#4ade80" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">AI VIDEO PROMPT (VEO 2 / KLING / RUNWAY)</text>
    <foreignObject x="16" y="116" width="480" height="186">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #cbd5e1; font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; line-height: 1.55; word-break: break-word;">
        <span style="color: #60a5fa;">[Style]:</span> Cinematic 35mm film still, shallow depth of field, 8k.<br/>
        <span style="color: #facc15;">[Macro Focus]:</span> Coach hand holding black dry-erase marker writing boldly on clean whiteboard: "#21 LU ZI-XUAN (SF STARTER)".<br/>
        <span style="color: #f87171;">[Rack Focus Tilt]:</span> Camera tilts up and rack-focuses to 20yo Lu Zi-xuan sitting in back row with moist reddened emotional eyes and clenched white knuckles.<br/>
        <span style="color: #a78bfa;">[Lighting &amp; Atmosphere]:</span> Golden morning sunbeams through window blinds, dust motes floating, teammates clapping.<br/>
        <span style="color: #94a3b8;">[Specs]:</span> Macro Rack Focus Tilt-Up, Eye-level Macro, --ar 9:16
      </div>
    </foreignObject>

    <rect x="0" y="322" width="512" height="52" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="342" fill="#f87171" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold">NEGATIVE PROMPT:</text>
    <text x="16" y="360" fill="#71717a" font-family="'Segoe UI', Arial, sans-serif" font-size="11">misspelled name, shaky handwriting, dark room, frowning teammates, blurry, cartoon</text>

    <rect x="0" y="384" width="512" height="70" rx="8" fill="#422006" stroke="#ca8a04" stroke-width="1"/>
    <text x="16" y="406" fill="#facc15" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold">AUDIO TRACK (TTS &amp; FOLEY SFX)</text>
    <text x="16" y="426" fill="#fef08a" font-family="'Segoe UI', Arial, sans-serif" font-size="12">VO: [proud/warm]「陸子軒，明天開場跳球，去把你的球場拿下來。」</text>
    <text x="16" y="444" fill="#fef9c3" font-family="'Segoe UI', Arial, sans-serif" font-size="11">SFX: 白板筆書寫清脆摩擦聲（Marker Squeak）+ 隊友劇烈拍打桌椅掌聲</text>
  </g>

  <text x="32" y="995" fill="#475569" font-family="'Segoe UI', Arial, sans-serif" font-size="11">PROJECT: BASKETBALL-STARTER-21 · STORYBOARD IMAGE GENERATOR · 9:16 VERTICAL</text>
  <text x="544" y="995" fill="#475569" font-family="'Segoe UI', Arial, sans-serif" font-size="11" text-anchor="end">SLATE 06/07</text>
</svg>
